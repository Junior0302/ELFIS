# ELFIS Core — investor-demo / production API (Render Blueprint)
# Aucun secret, mot de passe ou URL de base réelle dans ce fichier.
# DATABASE_URL est injecté par Render depuis la base déclarée ci-dessous.

databases:
  - name: elfis-core-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: 16
    databaseName: elfis
    user: elfis
    ipAllowList: []

services:
  - type: web
    name: elfis-core-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health/live
    autoDeploy: false
    preDeployCommand: python -m scripts.rc1.migrate_sql
    envVars:
      - key: ELFIS_ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: ELFIS_BILLING_ENABLED
        value: "false"
      - key: ELFIS_AI_ENABLED
        value: "false"
      - key: ELFIS_OCR_ENABLED
        value: "false"
      - key: ELFIS_OCR_PROVIDER
        value: disabled
      - key: ELFIS_EVENT_WORKER_ENABLED
        value: "false"
      - key: ELFIS_JOB_WORKER_ENABLED
        value: "false"
      - key: ELFIS_DEV_TRIAL_ENABLED
        value: "false"
      - key: ELFIS_DEMO_BANK_ENABLED
        value: "true"
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_DIR
        value: /data/storage
      - key: DATABASE_URL
        fromDatabase:
          name: elfis-core-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: PLATFORM_EMAIL_FROM
        sync: false
      - key: PLATFORM_EMAIL_FROM_NAME
        value: ELFIS Core
      - key: SMTP_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: BANKING_BRIDGE_CLIENT_ID
        sync: false
      - key: BANKING_BRIDGE_CLIENT_SECRET
        sync: false
      - key: BANKING_BRIDGE_REDIRECT_URI
        sync: false
      - key: EMAIL_CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_OAUTH_REDIRECT_URI
        sync: false
    disk:
      name: elfis-core-data
      mountPath: /data
      sizeGB: 1
