name: ELFIS Core CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      ELFIS_ENVIRONMENT: test
      ELFIS_PERFORMANCE_TESTS_ENABLED: "false"
      ELFIS_DISABLE_EXTERNAL_NETWORK: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: python -m compileall -q app tests
      - name: Check migrations
        run: python scripts/production/check_migrations.py
      - name: Import FastAPI app
        run: python -c "from app.main import app; print('ROUTES=', len(app.routes))"
      - name: Pytest
        run: |
          python -m pytest tests \
            --ignore=tests/performance \
            --ignore=tests/concurrency \
            -q \
            --tb=line

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          VITE_API_URL: https://api.example.test
          VITE_FIREBASE_API_KEY: AIzaSyDummyPublicWebKeyForTestsOnly12
          VITE_FIREBASE_AUTH_DOMAIN: ci.example.test
          VITE_FIREBASE_PROJECT_ID: elfis-ci
          VITE_FIREBASE_APP_ID: "1:000000000000:web:ciabcdef012345"
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t elfis-core-ci:${{ github.sha }} \
            backend
